<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Customers — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div class="admin-shell">
  <div id="adminSidebar"></div>
  <main class="admin-main">
    <div id="adminTopbar"></div>
    <div class="card-pi p-3">
      <div class="scroll-x"><table class="table-pi"><thead><tr><th>Customer</th><th>Contact</th><th>Orders</th><th>Spent</th><th>Joined</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/admin.js"></script>
<script>
if(PIAdmin.mount('cust','Customers')){
  const list=PI.get('pi.customers',[]);
  document.getElementById('rows').innerHTML=list.map(c=>`<tr>
    <td><div class="d-flex gap-2 align-items-center"><div class="pi-logo">${c.name[0]}</div><div><div class="fw-semibold">${c.name}</div><div class="small text-muted">${c.email}</div></div></div></td>
    <td>${c.phone}</td><td>${c.orders}</td><td><strong>${PI.fmt(c.spent)}</strong></td><td>${c.joined}</td>
    <td><button class="btn btn-info btn-sm"><i class="fa-solid fa-eye"></i></button> <button class="btn btn-purple btn-sm"><i class="fa-solid fa-envelope"></i></button></td>
  </tr>`).join('');
}
</script>
</body></html>
