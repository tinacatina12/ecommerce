<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Orders — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div class="admin-shell">
  <div id="adminSidebar"></div>
  <main class="admin-main">
    <div id="adminTopbar"></div>
    <div class="card-pi p-3">
      <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-ghost btn-sm" onclick="filter('')">All</button>
          <button class="btn btn-ghost btn-sm" onclick="filter('paid')">Paid</button>
          <button class="btn btn-ghost btn-sm" onclick="filter('pending')">Pending</button>
          <button class="btn btn-ghost btn-sm" onclick="filter('shipped')">Shipped</button>
          <button class="btn btn-ghost btn-sm" onclick="filter('cancel')">Cancelled</button>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-purple"><i class="fa-solid fa-file-export"></i> Export</button>
          <button class="btn btn-dark" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
        </div>
      </div>
      <div class="scroll-x"><table class="table-pi"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Payment</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/admin.js"></script>
<script>
if(PIAdmin.mount('ord','Orders')){
  let cur='';
  window.filter=(s)=>{cur=s;render();};
  function render(){
    const list=PI.orders().filter(o=>!cur||o.status===cur);
    document.getElementById('rows').innerHTML = list.map(o=>`<tr>
      <td><strong>${o.id}</strong></td><td>${o.customer}<div class="small text-muted">${o.email}</div></td>
      <td>${new Date(o.date).toLocaleString()}</td><td>${o.payment}</td><td>${o.items}</td>
      <td><strong>${PI.fmt(o.total)}</strong></td>
      <td><span class="status s-${o.status}">${o.status}</span></td>
      <td><div class="d-flex gap-1">
        <button class="btn btn-success btn-sm" onclick="approve('${o.id}')"><i class="fa-solid fa-check"></i></button>
        <button class="btn btn-info btn-sm"><i class="fa-solid fa-eye"></i></button>
        <button class="btn btn-danger btn-sm" onclick="cancel('${o.id}')"><i class="fa-solid fa-xmark"></i></button>
      </div></td></tr>`).join('');
  }
  window.approve=(id)=>{const list=PI.orders();const o=list.find(x=>x.id===id);if(o){o.status='paid';PI.set('pi.orders',list);PI.toast('Order approved','success');render();}};
  window.cancel=(id)=>{const list=PI.orders();const o=list.find(x=>x.id===id);if(o){o.status='cancel';PI.set('pi.orders',list);PI.toast('Order cancelled','info');render();}};
  render();
}
</script>
</body></html>
