<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Categories — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div class="admin-shell">
  <div id="adminSidebar"></div>
  <main class="admin-main">
    <div id="adminTopbar"></div>
    <div class="card-pi p-3">
      <div class="d-flex justify-content-between mb-3"><h6 class="fw-bold m-0">All categories</h6>
        <form class="d-flex gap-2" onsubmit="add(event)">
          <input id="cName" class="form-control" placeholder="Category name" required/>
          <input id="cIcon" class="form-control" placeholder="fa-icon (e.g. fa-tag)"/>
          <button class="btn btn-success"><i class="fa-solid fa-plus"></i> Add</button>
        </form>
      </div>
      <div class="row g-3" id="grid"></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/admin.js"></script>
<script>
if(PIAdmin.mount('cat','Categories')){
  function render(){const cats=PI.get('pi.cats',[]);
    document.getElementById('grid').innerHTML=cats.map(c=>`<div class="col-6 col-md-3"><div class="cat-tile"><div class="ico"><i class="fa-solid ${c.icon}"></i></div><div class="fw-semibold">${c.name}</div><button class="btn btn-danger btn-sm mt-2" onclick="del('${c.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join('');}
  window.add=(e)=>{e.preventDefault();const n=document.getElementById('cName').value.trim();const i=document.getElementById('cIcon').value.trim()||'fa-tag';if(!n)return;const cats=PI.get('pi.cats',[]);cats.push({id:n.toLowerCase().replace(/\s+/g,'-'),name:n,icon:i});PI.set('pi.cats',cats);e.target.reset();PI.toast('Category added','success');render();};
  window.del=(id)=>{Swal.fire({icon:'warning',title:'Delete category?',showCancelButton:true,confirmButtonColor:'#ef4444'}).then(r=>{if(r.isConfirmed){PI.set('pi.cats',PI.get('pi.cats',[]).filter(c=>c.id!==id));render();}});};
  render();
}
</script>
</body></html>
