<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Settings — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div class="admin-shell">
  <div id="adminSidebar"></div>
  <main class="admin-main">
    <div id="adminTopbar"></div>
    <div class="card-pi p-4">
      <h5 class="fw-bold mb-3">Store settings</h5>
      <form id="setForm" class="row g-3">
        <div class="col-md-6"><label class="form-label small">Store name</label><input class="form-control" name="storeName"/></div>
        <div class="col-md-6"><label class="form-label small">Currency</label><input class="form-control" name="currency"/></div>
        <div class="col-md-6"><label class="form-label small">Phone</label><input class="form-control" name="phone"/></div>
        <div class="col-md-6"><label class="form-label small">Address</label><input class="form-control" name="address"/></div>
        <div class="col-md-6"><label class="form-label small">Weekday hours</label><input class="form-control" name="hoursWeekday"/></div>
        <div class="col-md-6"><label class="form-label small">Sunday hours</label><input class="form-control" name="hoursSunday"/></div>
        <div class="col-12 d-flex gap-2 mt-3">
          <button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save</button>
          <button class="btn btn-warning" type="reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
          <button type="button" class="btn btn-danger ms-auto" onclick="reseed()"><i class="fa-solid fa-bomb"></i> Reset all data</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/admin.js"></script>
<script>
if(PIAdmin.mount('set','Settings')){
  const s=PI.get('pi.settings',{});
  const f=document.getElementById('setForm');
  Object.keys(s).forEach(k=>{if(f[k])f[k].value=s[k];});
  f.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f);const o={};fd.forEach((v,k)=>o[k]=v);PI.set('pi.settings',o);PI.toast('Settings saved','success');});
  window.reseed=()=>{Swal.fire({icon:'warning',title:'Reset all data?',text:'This clears cart, orders, products, etc.',showCancelButton:true,confirmButtonColor:'#ef4444'}).then(r=>{if(r.isConfirmed){['pi.products','pi.cart','pi.wish','pi.orders','pi.cats','pi.customers','pi.settings','pi.user'].forEach(k=>localStorage.removeItem(k));location.reload();}});};
}
</script>
</body></html>
