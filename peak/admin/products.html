<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Products — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div class="admin-shell">
  <div id="adminSidebar"></div>
  <main class="admin-main">
    <div id="adminTopbar"></div>
    <div class="card-pi p-3">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <div class="pi-search"><i class="fa-solid fa-magnifying-glass text-muted"></i><input id="search" placeholder="Search products..."/></div>
        <div class="d-flex gap-2">
          <button class="btn btn-purple"><i class="fa-solid fa-file-export"></i> Export</button>
          <button class="btn btn-dark" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
          <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#pModal" onclick="openNew()"><i class="fa-solid fa-plus"></i> New product</button>
        </div>
      </div>
      <div class="scroll-x"><table class="table-pi"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Tag</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </main>
</div>

<div class="modal fade" id="pModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content" style="border-radius:18px;border:1px solid var(--border);background:var(--surface);color:var(--text)">
  <div class="modal-header"><h5 class="modal-title fw-bold" id="pModalTitle">New product</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <form id="pForm" class="row g-3">
      <input type="hidden" name="id"/>
      <div class="col-md-8"><label class="form-label small">Name</label><input required class="form-control" name="name"/></div>
      <div class="col-md-4"><label class="form-label small">Emoji icon</label><input class="form-control" name="emoji" placeholder="🛍️"/></div>
      <div class="col-md-6"><label class="form-label small">Category</label><select class="form-select" name="cat" id="catSel"></select></div>
      <div class="col-md-3"><label class="form-label small">Price (UGX)</label><input required type="number" class="form-control" name="price"/></div>
      <div class="col-md-3"><label class="form-label small">Old price</label><input type="number" class="form-control" name="old"/></div>
      <div class="col-md-3"><label class="form-label small">Stock</label><input required type="number" class="form-control" name="stock"/></div>
      <div class="col-md-3"><label class="form-label small">Rating</label><input type="number" step="0.1" min="0" max="5" class="form-control" name="rating" value="4.5"/></div>
      <div class="col-md-6"><label class="form-label small">Tag</label><select class="form-select" name="tag"><option value="">None</option><option value="new">New</option><option value="best">Best</option><option value="sale">Sale</option></select></div>
      <div class="col-12"><label class="form-label small">Description</label><textarea class="form-control" rows="3" name="desc"></textarea></div>
    </form>
  </div>
  <div class="modal-footer"><button class="btn btn-warning" type="button" data-bs-dismiss="modal"><i class="fa-solid fa-rotate-left"></i> Cancel</button><button class="btn btn-success" onclick="save()"><i class="fa-solid fa-floppy-disk"></i> Save</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/admin.js"></script>
<script>
if(PIAdmin.mount('prod','Products')){
  const cats=PI.get('pi.cats',[]); const sel=document.getElementById('catSel');
  cats.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
  function render(){
    const q=document.getElementById('search').value.toLowerCase();
    const list=PI.products().filter(p=>!q||p.name.toLowerCase().includes(q));
    document.getElementById('rows').innerHTML = list.map(p=>`<tr>
      <td><div class="d-flex align-items-center gap-2"><span style="font-size:1.6rem">${p.emoji}</span><div><div class="fw-semibold">${p.name}</div><div class="small text-muted">${p.id.toUpperCase()}</div></div></div></td>
      <td>${p.cat}</td><td><strong>${PI.fmt(p.price)}</strong></td>
      <td>${p.stock<10?`<span class="status s-pending">${p.stock} low</span>`:`<span class="status s-paid">${p.stock}</span>`}</td>
      <td>★ ${p.rating}</td>
      <td>${p.tag?`<span class="status s-shipped">${p.tag}</span>`:'—'}</td>
      <td>
        <button class="btn btn-info btn-sm" onclick='openEdit("${p.id}")'><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-danger btn-sm" onclick="del('${p.id}')"><i class="fa-solid fa-trash"></i></button>
      </td></tr>`).join('');
  }
  window.openNew=()=>{document.getElementById('pForm').reset();document.getElementById('pModalTitle').textContent='New product';document.querySelector('#pForm [name=id]').value='';};
  window.openEdit=(id)=>{const p=PI.findProduct(id);if(!p)return;const f=document.getElementById('pForm');['id','name','emoji','cat','price','old','stock','rating','tag','desc'].forEach(k=>{if(f[k])f[k].value=p[k]??'';});document.getElementById('pModalTitle').textContent='Edit '+p.name;new bootstrap.Modal(document.getElementById('pModal')).show();};
  window.save=()=>{
    const f=document.getElementById('pForm'); const fd=new FormData(f);
    if(!fd.get('name')||!fd.get('price')){PI.toast('Name and price required','warning');return;}
    const list=PI.products();
    const obj={id:fd.get('id')||PI.uid(),name:fd.get('name'),emoji:fd.get('emoji')||'📦',cat:fd.get('cat'),price:+fd.get('price'),old:+fd.get('old')||0,stock:+fd.get('stock')||0,rating:+fd.get('rating')||4.5,tag:fd.get('tag'),desc:fd.get('desc')};
    const i=list.findIndex(x=>x.id===obj.id);
    if(i>-1) list[i]=obj; else list.unshift(obj);
    PI.saveProducts(list); bootstrap.Modal.getInstance(document.getElementById('pModal')).hide();
    PI.toast('Product saved','success'); render();
  };
  window.del=(id)=>{Swal.fire({icon:'warning',title:'Delete product?',showCancelButton:true,confirmButtonText:'Delete',confirmButtonColor:'#ef4444'}).then(r=>{if(r.isConfirmed){PI.saveProducts(PI.products().filter(p=>p.id!==id));PI.toast('Deleted','info');render();}});};
  document.getElementById('search').addEventListener('input',render);
  render();
}
</script>
</body></html>
