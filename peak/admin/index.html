<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Dashboard — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div class="admin-shell">
  <div id="adminSidebar"></div>
  <main class="admin-main">
    <div id="adminTopbar"></div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="kpi"><div class="d-flex justify-content-between"><div><div class="text-muted small">Revenue (30d)</div><div class="val" id="kRev">0</div><div class="small delta up"><i class="fa-solid fa-arrow-up"></i> 12.4%</div></div><div class="ico"><i class="fa-solid fa-sack-dollar"></i></div></div></div></div>
      <div class="col-6 col-md-3"><div class="kpi"><div class="d-flex justify-content-between"><div><div class="text-muted small">Orders</div><div class="val" id="kOrd">0</div><div class="small delta up"><i class="fa-solid fa-arrow-up"></i> 8.2%</div></div><div class="ico" style="background:linear-gradient(135deg,#16a34a,#22c55e)"><i class="fa-solid fa-receipt"></i></div></div></div></div>
      <div class="col-6 col-md-3"><div class="kpi"><div class="d-flex justify-content-between"><div><div class="text-muted small">Customers</div><div class="val" id="kCust">0</div><div class="small delta up"><i class="fa-solid fa-arrow-up"></i> 3.1%</div></div><div class="ico" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)"><i class="fa-solid fa-users"></i></div></div></div></div>
      <div class="col-6 col-md-3"><div class="kpi"><div class="d-flex justify-content-between"><div><div class="text-muted small">Low stock</div><div class="val" id="kStock">0</div><div class="small delta down"><i class="fa-solid fa-triangle-exclamation"></i> Items</div></div><div class="ico" style="background:linear-gradient(135deg,#f59e0b,#f97316)"><i class="fa-solid fa-boxes-stacked"></i></div></div></div></div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-lg-8"><div class="card-pi p-3"><div class="d-flex justify-content-between align-items-center mb-2"><h6 class="m-0 fw-bold">Revenue trend</h6><span class="status s-paid">Last 12 weeks</span></div><canvas id="chRev" height="110"></canvas></div></div>
      <div class="col-lg-4"><div class="card-pi p-3"><h6 class="m-0 fw-bold mb-2">Orders by status</h6><canvas id="chStatus" height="180"></canvas></div></div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7"><div class="card-pi p-3">
        <div class="d-flex justify-content-between align-items-center mb-2"><h6 class="m-0 fw-bold">Recent orders</h6><a href="orders.html" class="btn btn-ghost btn-sm">View all</a></div>
        <div class="scroll-x"><table class="table-pi"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="recentOrders"></tbody></table></div>
      </div></div>
      <div class="col-lg-5"><div class="card-pi p-3">
        <h6 class="fw-bold mb-2">Top products</h6>
        <div id="topProducts"></div>
      </div></div>
    </div>

  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/admin.js"></script>
<script>
if(PIAdmin.mount('dash','Dashboard overview')){
  const orders=PI.orders(), products=PI.products(), customers=PI.get('pi.customers',[]);
  const rev=orders.reduce((s,o)=>s+(o.status!=='cancel'?o.total:0),0);
  function counter(id,end,prefix=''){let s=0,step=end/60;const t=setInterval(()=>{s+=step;if(s>=end){s=end;clearInterval(t);}document.getElementById(id).textContent=prefix+Math.floor(s).toLocaleString();},20);}
  counter('kRev',rev,'UGX ');counter('kOrd',orders.length);counter('kCust',customers.length);
  document.getElementById('kStock').textContent = products.filter(p=>p.stock<10).length;

  document.getElementById('recentOrders').innerHTML = orders.slice(0,6).map(o=>`<tr><td><strong>${o.id}</strong></td><td>${o.customer}</td><td>${PI.fmt(o.total)}</td><td><span class="status s-${o.status}">${o.status}</span></td><td>${new Date(o.date).toLocaleDateString()}</td></tr>`).join('');

  document.getElementById('topProducts').innerHTML = products.slice(0,5).map(p=>`<div class="d-flex align-items-center gap-3 py-2 border-bottom"><div style="font-size:1.8rem">${p.emoji}</div><div class="flex-grow-1"><div class="fw-semibold small">${p.name}</div><div class="text-muted small">${p.cat}</div></div><div class="fw-bold">${PI.fmt(p.price)}</div></div>`).join('');

  const ctx=document.getElementById('chRev');
  new Chart(ctx,{type:'line',data:{labels:['W1','W2','W3','W4','W5','W6','W7','W8','W9','W10','W11','W12'],datasets:[{label:'Revenue (M UGX)',data:[1.2,1.5,1.8,1.4,2.1,2.4,2.0,2.8,3.1,3.4,3.0,3.7],borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.12)',fill:true,tension:.4,pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

  const counts={paid:0,pending:0,shipped:0,cancel:0};orders.forEach(o=>counts[o.status]++);
  new Chart(document.getElementById('chStatus'),{type:'doughnut',data:{labels:['Paid','Pending','Shipped','Cancelled'],datasets:[{data:[counts.paid,counts.pending,counts.shipped,counts.cancel],backgroundColor:['#16a34a','#f59e0b','#0ea5e9','#ef4444'],borderWidth:0}]},options:{cutout:'68%',plugins:{legend:{position:'bottom'}}}});
}
</script>
</body></html>
