<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div id="pi-header"></div>
<main class="container-xxl py-4">
  <nav class="small text-muted mb-3" id="crumb"></nav>
  <div id="detail"></div>
  <section class="section-sm">
    <h4 class="fw-bold mb-3">Related products</h4>
    <div class="row g-3" id="related"></div>
  </section>
</main>
<div id="pi-footer"></div><div id="pi-bottom"></div><div id="pi-fab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
PILayout.mount('shop');
const id=new URLSearchParams(location.search).get('id');
const p=PI.findProduct(id);
const det=document.getElementById('detail');
if(!p){ det.innerHTML='<div class="empty"><div class="ico"><i class="fa-solid fa-box-open"></i></div>Product not found</div>'; }
else {
  document.title = p.name+' — Peak Investments';
  document.getElementById('crumb').innerHTML = `<a href="../index.html">Home</a> <i class="fa-solid fa-angle-right mx-1"></i> <a href="shop.html?cat=${p.cat}">${p.cat}</a> <i class="fa-solid fa-angle-right mx-1"></i> <span>${p.name}</span>`;
  const old=p.old?`<span class="text-muted text-decoration-line-through ms-2">${PI.fmt(p.old)}</span>`:'';
  const off=p.old?`<span class="status s-cancel ms-2">-${Math.round((1-p.price/p.old)*100)}%</span>`:'';
  det.innerHTML = `
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card-pi p-4 text-center" style="font-size:14rem">${p.emoji}</div>
      <div class="row g-2 mt-2">${['🔍','📐','🎨','✨'].map(e=>`<div class="col-3"><div class="card-pi p-3 text-center" style="font-size:2rem">${e}</div></div>`).join('')}</div>
    </div>
    <div class="col-lg-6">
      <div class="small text-uppercase text-muted">${p.cat}</div>
      <h1 class="fw-bold mt-1">${p.name}</h1>
      <div class="text-warning mb-2">${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5-Math.round(p.rating))} <span class="text-muted small">(${p.rating} · 128 reviews)</span></div>
      <div class="h3 fw-bold">${PI.fmt(p.price)} ${old} ${off}</div>
      <p class="text-muted mt-2">${p.desc||''}</p>
      <div class="d-flex gap-3 my-3">
        <div class="qty"><button onclick="chgQ(-1)">−</button><span id="q">1</span><button onclick="chgQ(1)">+</button></div>
        <span class="status ${p.stock>0?'s-paid':'s-cancel'}">${p.stock>0?p.stock+' in stock':'Out of stock'}</span>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary btn-lg" onclick="add()"><i class="fa-solid fa-cart-plus"></i> Add to cart</button>
        <button class="btn btn-success btn-lg" onclick="buy()"><i class="fa-solid fa-bolt"></i> Buy now</button>
        <button class="btn btn-ghost btn-lg" onclick="PI.toggleWish('${p.id}');PI.toast('Wishlist updated','success')"><i class="fa-regular fa-heart"></i></button>
      </div>
      <div class="row g-2 mt-4">
        <div class="col-6 col-md-4"><div class="card-pi p-3 text-center"><i class="fa-solid fa-truck text-gradient h4"></i><div class="small fw-bold">Same-day Kampala</div></div></div>
        <div class="col-6 col-md-4"><div class="card-pi p-3 text-center"><i class="fa-solid fa-store text-gradient h4"></i><div class="small fw-bold">In-store pickup</div></div></div>
        <div class="col-6 col-md-4"><div class="card-pi p-3 text-center"><i class="fa-solid fa-shield text-gradient h4"></i><div class="small fw-bold">7-day returns</div></div></div>
      </div>
      <div class="mt-4">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#desc">Description</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#spec">Specifications</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#rev">Reviews</button></li>
        </ul>
        <div class="tab-content p-3 border border-top-0 rounded-bottom">
          <div class="tab-pane fade show active" id="desc">${p.desc}</div>
          <div class="tab-pane fade" id="spec"><ul class="list-unstyled m-0"><li><strong>Category:</strong> ${p.cat}</li><li><strong>SKU:</strong> ${p.id.toUpperCase()}</li><li><strong>Warranty:</strong> 12 months</li></ul></div>
          <div class="tab-pane fade" id="rev"><div class="text-muted small">Reviews UI placeholder — connect to backend in next phase.</div></div>
        </div>
      </div>
    </div>
  </div>`;
  let q=1; window.chgQ=(d)=>{q=Math.max(1,q+d);document.getElementById('q').textContent=q;};
  window.add=()=>PI.addToCart(p.id,q);
  window.buy=()=>{PI.addToCart(p.id,q);location.href='checkout.html';};
  PIUI.renderGrid(document.getElementById('related'), PI.products().filter(x=>x.cat===p.cat && x.id!==p.id).slice(0,4));
}
</script>
</body></html>
