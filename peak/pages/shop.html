<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shop — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div id="pi-header"></div>

<main class="container-xxl py-4">
  <nav class="small text-muted mb-3"><a href="../index.html">Home</a> <i class="fa-solid fa-angle-right mx-1"></i> <span>Shop</span></nav>
  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="filter-card">
        <h6 class="fw-bold mb-3"><i class="fa-solid fa-filter me-2"></i>Filters</h6>
        <div class="mb-3">
          <label class="small text-muted mb-1">Search</label>
          <div class="input-icon"><i class="fa-solid fa-magnifying-glass"></i><input id="fSearch" class="form-control" placeholder="Search products..."/></div>
        </div>
        <div class="mb-3">
          <label class="small text-muted mb-1">Category</label>
          <select id="fCat" class="form-select"><option value="">All categories</option></select>
        </div>
        <div class="mb-3">
          <label class="small text-muted mb-1">Max price (UGX)</label>
          <input id="fPrice" type="range" class="form-range" min="50000" max="2500000" step="50000" value="2500000"/>
          <div class="d-flex justify-content-between small text-muted"><span>50K</span><span id="fPriceVal">2,500,000</span></div>
        </div>
        <div class="mb-3">
          <label class="small text-muted mb-1">Availability</label>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="fStock"/><label class="form-check-label" for="fStock">In stock only</label></div>
        </div>
        <div class="mb-3">
          <label class="small text-muted mb-1">Sort by</label>
          <select id="fSort" class="form-select">
            <option value="popular">Popularity</option>
            <option value="new">Newest</option>
            <option value="lo">Price: Low to high</option>
            <option value="hi">Price: High to low</option>
            <option value="rating">Top rated</option>
          </select>
        </div>
        <button class="btn btn-ghost w-100" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      </div>
    </aside>
    <section class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div><h2 class="m-0 fw-bold" id="pageTitle">All products</h2><div class="text-muted small" id="resCount">0 results</div></div>
      </div>
      <div class="row g-3" id="grid"></div>
    </section>
  </div>
</main>

<div id="pi-footer"></div><div id="pi-bottom"></div><div id="pi-fab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
PILayout.mount('shop');
const params=new URLSearchParams(location.search);
const cats=PI.get('pi.cats',[]);
const sel=document.getElementById('fCat');
cats.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
if(params.get('cat')) sel.value=params.get('cat');
if(params.get('q')) document.getElementById('fSearch').value=params.get('q');

function apply(){
  let p=PI.products();
  const q=document.getElementById('fSearch').value.toLowerCase().trim();
  const c=document.getElementById('fCat').value;
  const max=+document.getElementById('fPrice').value;
  const stock=document.getElementById('fStock').checked;
  const sort=document.getElementById('fSort').value;
  if(q) p=p.filter(x=>x.name.toLowerCase().includes(q)||x.cat.includes(q));
  if(c) p=p.filter(x=>x.cat===c);
  p=p.filter(x=>x.price<=max);
  if(stock) p=p.filter(x=>x.stock>0);
  if(sort==='lo') p.sort((a,b)=>a.price-b.price);
  if(sort==='hi') p.sort((a,b)=>b.price-a.price);
  if(sort==='rating') p.sort((a,b)=>b.rating-a.rating);
  if(sort==='new') p.sort((a,b)=>(b.tag==='new')-(a.tag==='new'));
  document.getElementById('resCount').textContent = p.length+' results';
  document.getElementById('pageTitle').textContent = c ? (cats.find(x=>x.id===c)?.name||'Shop') : 'All products';
  document.getElementById('fPriceVal').textContent = (+document.getElementById('fPrice').value).toLocaleString();
  PIUI.renderGrid(document.getElementById('grid'), p);
}
['fSearch','fCat','fPrice','fStock','fSort'].forEach(id=>document.getElementById(id).addEventListener('input',apply));
function resetFilters(){document.getElementById('fSearch').value='';document.getElementById('fCat').value='';document.getElementById('fPrice').value=2500000;document.getElementById('fStock').checked=false;document.getElementById('fSort').value='popular';apply();}
apply();
</script>
</body></html>
