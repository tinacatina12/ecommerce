<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Create account — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div class="auth-wrap">
  <div class="auth-art">
    <div class="position-relative" style="max-width:440px">
      <div class="d-flex align-items-center gap-2 mb-4"><span class="pi-logo">P</span><strong>PEAK Investments</strong></div>
      <h1 class="fw-bold" style="font-size:2.6rem;line-height:1.1">Join Kampala's premium marketplace.</h1>
      <p class="mt-3" style="opacity:.85">Create an account to save addresses, track orders and earn loyalty perks.</p>
    </div>
  </div>
  <div class="auth-form">
    <div class="auth-card">
      <h3 class="fw-bold mb-1">Create account</h3>
      <p class="text-muted small">Have an account? <a href="login.html" class="fw-semibold">Sign in</a></p>
      <form id="regForm" class="mt-3">
        <div class="mb-3"><label class="form-label small">Full name</label><div class="input-icon"><i class="fa-solid fa-user"></i><input required class="form-control" name="name"/></div></div>
        <div class="mb-3"><label class="form-label small">Email</label><div class="input-icon"><i class="fa-solid fa-envelope"></i><input required type="email" class="form-control" name="email"/></div></div>
        <div class="mb-3"><label class="form-label small">Phone</label><div class="input-icon"><i class="fa-solid fa-phone"></i><input required class="form-control" name="phone" placeholder="+256 7xx xxx xxx"/></div></div>
        <div class="mb-3"><label class="form-label small">Password</label><div class="input-icon"><i class="fa-solid fa-lock"></i><input required type="password" minlength="6" class="form-control" name="password"/></div></div>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="ag" required/><label class="form-check-label small" for="ag">I agree to the Terms and Privacy Policy</label></div>
        <button class="btn btn-primary btn-lg w-100" type="submit"><i class="fa-solid fa-user-plus"></i> Create account</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit',e=>{
  e.preventDefault();const fd=new FormData(e.target);
  try{const u=PI.register(fd.get('name'),fd.get('email'),fd.get('password'));
    Swal.fire({icon:'success',title:'Account created!',text:'Welcome to Peak, '+u.name,timer:1500,showConfirmButton:false}).then(()=>location.href='account.html');
  }catch(err){Swal.fire({icon:'error',title:'Error',text:err.message});}
});
</script>
</body></html>
