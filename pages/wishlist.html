<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wishlist — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div id="pi-header"></div>
<main class="container-xxl py-4">
  <h2 class="fw-bold mb-3"><i class="fa-regular fa-heart me-2"></i>Wishlist</h2>
  <div class="row g-3" id="grid"></div>
</main>
<div id="pi-footer"></div><div id="pi-bottom"></div><div id="pi-fab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
PILayout.mount('wish');
const ids=PI.wish();
const items=PI.products().filter(p=>ids.includes(p.id));
PIUI.renderGrid(document.getElementById('grid'),items);
</script>
</body></html>
