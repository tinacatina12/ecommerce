<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My account — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div id="pi-header"></div>
<main class="container-xxl py-4">
  <div id="content"></div>
</main>
<div id="pi-footer"></div><div id="pi-bottom"></div><div id="pi-fab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
PILayout.mount('account');
const u=PI.user();
const c=document.getElementById('content');
if(!u){c.innerHTML=`<div class="empty card-pi"><div class="ico"><i class="fa-solid fa-user-lock"></i></div>Please sign in to view your account<br/><a href="login.html" class="btn btn-primary mt-3"><i class="fa-solid fa-right-to-bracket"></i> Sign in</a></div>`;}
else{
  const orders=PI.orders();
  c.innerHTML=`
    <div class="row g-4">
      <div class="col-lg-3">
        <div class="card-pi p-4 text-center">
          <div class="pi-logo mx-auto" style="width:72px;height:72px;font-size:1.6rem">${u.name[0].toUpperCase()}</div>
          <h5 class="mt-3 mb-0 fw-bold">${u.name}</h5>
          <div class="small text-muted">${u.email}</div>
          <span class="status s-paid mt-2">${u.role}</span>
        </div>
        <div class="card-pi p-2 mt-3">
          <a class="nav-link active" href="#orders"><i class="fa-solid fa-receipt me-2"></i>My Orders</a>
          <a class="nav-link" href="#profile"><i class="fa-solid fa-id-badge me-2"></i>Profile</a>
          <a class="nav-link" href="wishlist.html"><i class="fa-regular fa-heart me-2"></i>Wishlist</a>
          ${u.role==='admin'?'<a class="nav-link" href="../admin/index.html"><i class="fa-solid fa-gauge-high me-2"></i>Admin</a>':''}
          <a class="nav-link text-danger" href="#" onclick="PI.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a>
        </div>
      </div>
      <div class="col-lg-9">
        <div class="card-pi p-4 mb-4" id="orders">
          <div class="d-flex justify-content-between align-items-center mb-3"><h5 class="m-0 fw-bold">Recent orders</h5><span class="text-muted small">${orders.length} total</span></div>
          <div class="scroll-x"><table class="table-pi"><thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Payment</th><th>Total</th><th>Status</th></tr></thead><tbody>
            ${orders.slice(0,8).map(o=>`<tr><td><strong>${o.id}</strong></td><td>${new Date(o.date).toLocaleDateString()}</td><td>${o.items}</td><td>${o.payment}</td><td><strong>${PI.fmt(o.total)}</strong></td><td><span class="status s-${o.status}">${o.status}</span></td></tr>`).join('')}
          </tbody></table></div>
        </div>
        <div class="card-pi p-4" id="profile">
          <h5 class="fw-bold mb-3">Profile settings</h5>
          <form class="row g-3" onsubmit="event.preventDefault();PI.toast('Profile saved','success')">
            <div class="col-md-6"><label class="form-label small">Name</label><input class="form-control" value="${u.name}"/></div>
            <div class="col-md-6"><label class="form-label small">Email</label><input class="form-control" value="${u.email}"/></div>
            <div class="col-md-6"><label class="form-label small">Phone</label><input class="form-control" placeholder="+256..."/></div>
            <div class="col-md-6"><label class="form-label small">City</label><input class="form-control" value="Kampala"/></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Save</button><button type="reset" class="btn btn-warning"><i class="fa-solid fa-rotate-left"></i> Reset</button></div>
          </form>
        </div>
      </div>
    </div>`;
}
</script>
</body></html>
