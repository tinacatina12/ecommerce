<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cart — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div id="pi-header"></div>
<main class="container-xxl py-4">
  <h2 class="fw-bold mb-3"><i class="fa-solid fa-cart-shopping me-2"></i>Your cart</h2>
  <div class="row g-4">
    <div class="col-lg-8" id="cartList"></div>
    <div class="col-lg-4">
      <div class="card-pi p-4 position-sticky" style="top:96px">
        <h5 class="fw-bold">Order summary</h5>
        <div class="d-flex justify-content-between mt-3"><span>Subtotal</span><strong id="sub">UGX 0</strong></div>
        <div class="d-flex justify-content-between"><span>Delivery</span><span class="text-muted">At checkout</span></div>
        <div class="d-flex justify-content-between"><span>Tax</span><span class="text-muted">Included</span></div>
        <hr/>
        <div class="d-flex justify-content-between h5"><span>Total</span><strong id="tot">UGX 0</strong></div>
        <a href="checkout.html" class="btn btn-primary w-100 mt-3"><i class="fa-solid fa-credit-card"></i> Proceed to checkout</a>
        <a href="shop.html" class="btn btn-ghost w-100 mt-2"><i class="fa-solid fa-arrow-left"></i> Continue shopping</a>
      </div>
    </div>
  </div>
</main>
<div id="pi-footer"></div><div id="pi-bottom"></div><div id="pi-fab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
PILayout.mount('shop');
function render(){
  const c=PI.cart();
  const list=document.getElementById('cartList');
  if(!c.length){list.innerHTML='<div class="empty card-pi"><div class="ico">🛒</div>Your cart is empty<br/><a class="btn btn-primary mt-3" href="shop.html"><i class="fa-solid fa-bag-shopping"></i> Start shopping</a></div>';document.getElementById('sub').textContent=PI.fmt(0);document.getElementById('tot').textContent=PI.fmt(0);return;}
  list.innerHTML = c.map(i=>{const p=PI.findProduct(i.id);if(!p)return'';return `
    <div class="card-pi p-3 mb-3 d-flex flex-wrap align-items-center gap-3">
      <div style="font-size:3rem;width:80px;text-align:center">${p.emoji}</div>
      <div class="flex-grow-1" style="min-width:200px">
        <div class="fw-bold"><a href="product.html?id=${p.id}">${p.name}</a></div>
        <div class="small text-muted">${p.cat} · ${PI.fmt(p.price)}</div>
      </div>
      <div class="qty"><button onclick="PI.updateQty('${p.id}',-1);render()">−</button><span>${i.qty}</span><button onclick="PI.updateQty('${p.id}',1);render()">+</button></div>
      <div class="fw-bold" style="min-width:120px;text-align:right">${PI.fmt(p.price*i.qty)}</div>
      <button class="btn btn-danger btn-sm" onclick="PI.removeFromCart('${p.id}');render()"><i class="fa-solid fa-trash"></i></button>
    </div>`}).join('');
  document.getElementById('sub').textContent=PI.fmt(PI.cartTotal());
  document.getElementById('tot').textContent=PI.fmt(PI.cartTotal());
}
render();
</script>
</body></html>
