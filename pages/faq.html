<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FAQ — Peak Investments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/>
</head><body>
<div id="pi-header"></div>
<main class="container-xxl py-4">
  <h2 class="fw-bold">Frequently asked questions</h2>
  <div class="accordion mt-3" id="faq"></div>
</main>
<div id="pi-footer"></div><div id="pi-bottom"></div><div id="pi-fab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
PILayout.mount('faq');
const faqs=[
  ['What delivery options do you offer?','Same-day boda delivery in central Kampala, next-day courier to Wakiso & Entebbe, upcountry bus parcel routing, and free in-store pickup at Lukadde Road.'],
  ['What payment methods are accepted?','MTN Mobile Money, Airtel Money, Visa, Mastercard, contactless card payments and cash on delivery.'],
  ['Where is your physical store located?','Lukadde Road, Kampala. Free parking and free garage parking are available for all customers.'],
  ['What are your opening hours?','Mon–Sat: 8:00 AM – 9:00 PM. Sunday: 8:00 AM – 6:00 PM.'],
  ['What is your return policy?','7-day hassle-free returns on most items in original condition. Some categories like food and personal care are non-returnable.'],
  ['Do you offer warranty on electronics?','Yes — 12 months manufacturer warranty on most electronics, handled in-store or through the brand service center.']
];
document.getElementById('faq').innerHTML=faqs.map((f,i)=>`
  <div class="accordion-item card-pi mb-2 border-0">
    <h2 class="accordion-header"><button class="accordion-button ${i?'collapsed':''} fw-semibold" data-bs-toggle="collapse" data-bs-target="#q${i}">${f[0]}</button></h2>
    <div id="q${i}" class="accordion-collapse collapse ${i?'':'show'}" data-bs-parent="#faq"><div class="accordion-body text-muted">${f[1]}</div></div>
  </div>`).join('');
</script>
</body></html>
